[project]
name = "pygame-cadence"
version = "0.1.0"
description = "Schematic editor with a tkinter command window and a pygame canvas."
requires-python = ">=3.10"
dependencies = [
    "pygame-ce",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "command_window", "canvas_window"]
